<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Legion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050e18;
      font-family: 'Share Tech Mono', 'Courier New', monospace, sans-serif;
      color: #00ff66;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* Pause Menu Overlay */
    .pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 10, 15, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .pause-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .pause-panel {
      width: 440px;
      max-width: 90vw;
      background: rgba(6, 20, 28, 0.94);
      border: 1px solid rgba(0, 255, 102, 0.55);
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.2), inset 0 0 20px rgba(0, 255, 102, 0.08);
      padding: 32px 36px;
      position: relative;
    }

    .pause-panel::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 16px;
      height: 16px;
      border-top: 3px solid #00ff66;
      border-left: 3px solid #00ff66;
    }

    .pause-panel::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 16px;
      height: 16px;
      border-bottom: 3px solid #00ff66;
      border-right: 3px solid #00ff66;
    }

    .pause-header {
      margin-bottom: 26px;
      border-bottom: 1px solid rgba(0, 255, 102, 0.25);
      padding-bottom: 14px;
    }

    .pause-tag {
      font-size: 11px;
      letter-spacing: 2px;
      color: #00ffee;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .pause-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
      margin-bottom: 4px;
    }

    .pause-subtitle {
      font-size: 11px;
      color: rgba(0, 255, 102, 0.7);
      letter-spacing: 1.5px;
    }

    .pause-menu-items {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pause-btn {
      background: rgba(4, 28, 20, 0.6);
      border: 1px solid rgba(0, 255, 102, 0.4);
      color: #00ff66;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      padding: 13px 18px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pause-btn:hover {
      background: rgba(0, 255, 102, 0.22);
      border-color: #00ff66;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.35);
      padding-left: 24px;
    }

    .pause-btn.btn-exit {
      color: #ffaa55;
      border-color: rgba(255, 170, 85, 0.4);
      background: rgba(30, 20, 10, 0.5);
    }

    .pause-btn.btn-exit:hover {
      background: rgba(255, 100, 50, 0.22);
      border-color: #ff6633;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 100, 50, 0.35);
    }

    .pause-settings-box {
      margin-top: 6px;
      margin-bottom: 6px;
      padding: 16px;
      background: rgba(2, 14, 20, 0.7);
      border: 1px solid rgba(0, 255, 102, 0.25);
    }

    .settings-title {
      font-size: 11px;
      letter-spacing: 2px;
      color: #00ffee;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .slider-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: rgba(0, 255, 102, 0.2);
      outline: none;
      border: 1px solid rgba(0, 255, 102, 0.4);
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 18px;
      background: #00ff66;
      border: 1px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 0 8px #00ff66;
    }

    .volume-slider::-moz-range-thumb {
      width: 14px;
      height: 18px;
      background: #00ff66;
      border: 1px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 0 8px #00ff66;
    }

    .volume-value {
      font-size: 13px;
      font-weight: bold;
      color: #00ffee;
      min-width: 44px;
      text-align: right;
    }

    .pause-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(0, 255, 102, 0.55);
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Tactical Pause Menu (ESC) -->
  <div id="pause-menu" class="pause-overlay hidden">
    <div class="pause-panel">
      <div class="pause-header">
        <div class="pause-tag">// SYSTEM PAUSED</div>
        <h2 class="pause-title">TEST FLIGHT</h2>
        <div class="pause-subtitle">TACTICAL SIMULATION SUSPENDED</div>
      </div>

      <div class="pause-menu-items">
        <button id="btn-pause-resume" class="pause-btn">
          <span>RESUME MISSION</span>
          <span>&gt;</span>
        </button>
        <button id="btn-pause-restart" class="pause-btn">
          <span>RESTART TEST FLIGHT</span>
          <span>&gt;</span>
        </button>

        <div class="pause-settings-box">
          <div class="settings-title">// SYSTEM SETTINGS</div>
          <div class="setting-row">
            <div class="setting-label-row">
              <label for="volume-slider">MASTER VOLUME</label>
              <span id="volume-val" class="volume-value">70%</span>
            </div>
            <div class="slider-wrapper">
              <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="70">
            </div>
          </div>
        </div>

        <button id="btn-pause-exit" class="pause-btn btn-exit">
          <span>EXIT MISSION</span>
          <span>&gt;</span>
        </button>
      </div>

      <div class="pause-footer">
        [ESC] TOGGLE PAUSE // [1-4] SWITCH AIRCRAFT // [C] CYCLE SPW
      </div>
    </div>
  </div>

  <script type="module" src="./js/game.js"></script>
</body>

</html>
